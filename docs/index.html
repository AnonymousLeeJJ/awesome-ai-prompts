<style>

  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn:hover { border-color: var(--accent); color: var(--accent); }

生成一个故事大纲：\n1. 用三幕结构（建置-对抗-结局）拆解\n2. 每幕列出 3-5 个关键情节点，标注情绪曲线\n3. 主角要有明确的「想要」和「需要」，并设计一个缺陷\n4. 至少安排 2 个反转，说明伏笔埋在哪里\n5. 最后写一段 100 字的故事简介（logline）\n\n我的创意：【填写创意】", "tags": ["小说", "编剧", "故事"]}, {"id": 5, "title": "代码审查专家", "titleEn": "Code Review Expert", "category": "coding", "description": "按大厂标准审查代码并给出修改建议", "prompt": "你是拥有 15 年经验的资深工程师，请 review 以下代码：\n1. 按严重程度分级列出问题：🔴 必须改（bug/安全/性能）→ 🟡 建议改（可读性/可维护性）→ 🟢 可选（风格）\n2. 每个问题给出具体修改后的代码\n3. 指出缺失的边界条件和异常处理\n4. 评估时间/空间复杂度，能优化则给出优化方案\n5. 最后给一句总体评价\n\n代码如下：\n\n【在此粘贴代码】", "tags": ["代码审查", "review", "质量"]}, {"id": 6, "title": "报错调试助手", "titleEn": "Debug Assistant", "category": "coding", "description": "系统化定位 bug 根因而非表象", "prompt": "你是调试专家。我遇到了一个 bug，请按以下流程帮我排查：\n1. 先复述你对问题的理解，确认症状\n2. 列出 3-5 个最可能的根因假设，按概率排序\n3. 对每个假设，给出一步具体的验证方法（改哪行代码/加什么日志）\n4. 如果我能提供更多信息，告诉我什么信息最关键\n5. 不要急着给最终修复，先定位根因\n\n【报错信息】：\n【相关代码】：\n【我试过的方法】：", "tags": ["调试", "bug", "排错"]}, {"id": 7, "title": "正则表达式生成器", "titleEn": "Regex Generator", "category": "coding", "description": "用自然语言描述需求生成正则并解释", "prompt": "你是正则表达式专家。请根据我的需求生成正则：\n1. 给出正则表达式本身（注明适用的语言/引擎）\n2. 逐段解释每个部分的含义\n3. 给出 3 个匹配成功和 3 个匹配失败的测试用例\n4. 指出常见的边界情况（空字符串、超长输入等）\n5. 如果有更简单的非正则方案，也请告诉我\n\n我的需求：【描述你想匹配的内容】", "tags": ["正则", "regex", "工具"]}, {"id": 8, "title": "技术方案架构师", "titleEn": "Solution Architect", "category": "coding", "description": "为需求设计技术方案并权衡取舍", "prompt": "你是资深架构师。请为我的需求设计技术方案：\n1. 先澄清 3 个最关键的问题（规模、约束、团队能力）\n2. 给出 2-3 个候选方案，每个方案列出：架构图（用文字描述）、技术栈、优缺点、成本\n3. 明确指出你的推荐及理由\n4. 列出主要风险及缓解措施\n5. 给出 MVP 的最小实现路径\n\n需求描述：【填写需求】", "tags": ["架构", "设计", "方案"]}, {"id": 9, "title": "SQL 优化顾问", "titleEn": "SQL Optimizer", "category": "coding", "description": "优化慢查询并解释执行计划", "prompt": "你是数据库性能优化专家（熟悉 MySQL/PostgreSQL）。请优化以下 SQL：\n1. 分析当前查询可能的性能瓶颈\n2. 给出优化后的 SQL，并解释每处改动\n3. 建议需要的索引（给出建索引语句）\n4. 说明优化前后的执行计划差异\n5. 如果表结构本身有问题，指出并给出改进建议\n\n【表结构】：\n【慢查询 SQL】：\n【数据量级】：", "tags": ["SQL", "数据库", "性能"]}, {"id": 10, "title": "Git 提交信息生成", "titleEn": "Commit Message Generator", "category": "coding", "description": "按 Conventional Commits 规范写提交信息", "prompt": "请根据我描述的代码改动，生成符合 Conventional Commits 规范的提交信息：\n1. 格式：<type>(<scope>): <subject>，type 从 feat/fix/docs/style/refactor/perf/test/chore 中选\n2. subject 用祈使句，不超过 50 字符\n3. 如改动复杂，补充 body 说明「为什么改」而非「改了什么」\n4. 给我英文和中文两个版本\n5. 如果改动应该拆成多个 commit，提醒我并给出拆分建议\n\n改动描述：【填写改动内容】", "tags": ["git", "commit", "规范"]}, {"id": 11, "title": "会议纪要整理", "titleEn": "Meeting Notes Organizer", "category": "productivity", "description": "把杂乱记录变成结构化纪要", "prompt": "请把我的会议记录整理成专业纪要，结构如下：\n1. 【会议主题】一句话概括\n2. 【关键结论】按重要性列出 3-5 条\n3. 【行动项】表格：任务 | 负责人 | 截止时间（原文没提到的标「待确认」）\n4. 【未决问题】需要后续讨论的点\n5. 【一句话总结】发给没参会的人看\n\n不要添加原文没有的信息。会议记录如下：\n\n【在此粘贴记录】", "tags": ["会议", "纪要", "办公"]}, {"id": 12, "title": "周报生成器", "titleEn": "Weekly Report Generator", "category": "productivity", "description": "把零散工作记录聚合成高质量周报", "prompt": "请把我这周的零散工作记录整理成周报：\n1. 按项目/主题归类，而不是按时间流水账\n2. 每条成果用「动作 + 结果 + 数据」的格式，突出价值\n3. 区分「已完成」「进行中（含进度%）」「阻塞（含需要的支持）」\n4. 下周计划只写 3 件最重要的事\n5. 语气专业客观，不夸大不流水账\n\n我的工作记录：\n\n【在此粘贴】", "tags": ["周报", "职场", "汇报"]}, {"id": 13, "title": "邮件润色与回复", "titleEn": "Email Polisher", "category": "productivity", "description": "把草稿变成得体专业的商务邮件", "prompt": "请帮我处理这封邮件：\n1. 先判断我的草稿语气是否合适（对收件人的身份而言），如不合适直接指出\n2. 给出润色版：结构为 称呼 → 一句话来意 → 正文（分点）→ 明确的下一步 → 落款\n3. 语气可选：正式 / 友好 / 坚定，默认友好\n4. 控制在 150 字以内，砍掉所有客套废话\n5. 给英文和中文两个版本\n\n收件人：【谁】\n我想表达：【草稿或要点】", "tags": ["邮件", "商务", "沟通"]}, {"id": 14, "title": "任务拆解教练", "titleEn": "Task Breakdown Coach", "category": "productivity", "description": "把大目标拆成今天就能做的小步骤", "prompt": "你是 GTD 和时间管理专家。我有一个大目标，请帮我拆解：\n1. 用逆向规划：从终点倒推出 3-5 个里程碑\n2. 每个里程碑拆成 2 小时内可完成的行动项\n3. 标出关键路径（哪些任务阻塞其他任务）\n4. 指出最可能让我放弃的 3 个坑，各给一个应对策略\n5. 告诉我「今天下午就能做的第一件事」是什么\n\n我的目标：【填写目标】\n截止时间：【填写】\n每天可投入时间：【填写】", "tags": ["GTD", "规划", "目标"]}, {"id": 15, "title": "苏格拉底式学习导师", "titleEn": "Socratic Tutor", "category": "learning", "description": "通过提问引导你真正理解一个概念", "prompt": "你是苏格拉底式导师，帮我学习【填写主题】。规则：\n1. 不要直接给答案，每次只问我一个问题，引导我自己想明白\n2. 根据我的回答判断我的理解程度，动态调整问题难度\n3. 我答错时，不直接纠正，而是追问让我发现矛盾\n4. 每 5 轮对话做一次小结，梳理我已掌握和仍模糊的点\n5. 我连续 3 次答不出时，给出提示并降低难度\n\n现在，请从第一个问题开始。", "tags": ["学习", "费曼", "导师"]}, {"id": 16, "title": "费曼讲解器", "titleEn": "Feynman Explainer", "category": "learning", "description": "把复杂概念讲到 10 岁小孩都懂", "prompt": "请用费曼技巧讲解【填写概念】：\n1. 第一层：用 10 岁小孩能懂的话 + 一个生活类比解释（不超过 100 字）\n2. 第二层：用高中生能懂的话，引入准确的术语\n3. 第三层：专业视角的准确定义和边界条件\n4. 指出 3 个最常见的误解\n5. 出 2 道自测题检验我是否真懂了（先别给答案）", "tags": ["费曼", "概念", "理解"]}, {"id": 17, "title": "语言学习陪练", "titleEn": "Language Partner", "category": "learning", "description": "沉浸式外语对话陪练与纠错", "prompt": "你是我的【填写语言】陪练，我的水平大约是【填写水平】。规则：\n1. 全程用目标语言和我对话，话题从【填写话题】开始\n2. 每轮对话后，用中文列出我的错误：原文 → 正确说法 → 一句话语法解释\n3. 教我一个本场景的地道表达（母语者真正会用的说法）\n4. 我卡壳时给 2 个提示选项让我选\n5. 对话难度略高于我的当前水平（i+1 原则）\n\n请开始第一轮对话。", "tags": ["外语", "口语", "英语"]}, {"id": 18, "title": "考试出题官", "titleEn": "Exam Question Writer", "category": "learning", "description": "根据材料生成测验题并批改", "prompt": "你是出题专家。请根据我提供的学习材料出题：\n1. 出 5 道题：2 道选择题（含干扰项设计说明）、2 道简答题、1 道综合应用题\n2. 覆盖记忆、理解、应用三个层次\n3. 我作答后逐题批改，指出我的知识漏洞\n4. 根据错题推荐我该重读材料的哪部分\n5. 全部答完后给我一个掌握度评分和复习建议\n\n学习材料：\n\n【在此粘贴材料】", "tags": ["考试", "测验", "复习"]}, {"id": 19, "title": "商业计划书顾问", "titleEn": "Business Plan Advisor", "category": "business", "description": "用投资人视角挑战和完善你的 BP", "prompt": "你是一位看过 1000+ BP 的风险投资人。请评估我的商业想法：\n1. 用一句话总结这个生意的本质（谁为什么付钱）\n2. 提出 5 个投资人一定会问的尖锐问题\n3. 分析市场规模时区分 TAM/SAM/SOM，并质疑我的数据来源\n4. 指出 3 个最可能的死法\n5. 给出 3 条具体改进建议，按优先级排序\n\n我的商业想法：【填写】", "tags": ["创业", "BP", "融资"]}, {"id": 20, "title": "面试模拟官", "titleEn": "Mock Interviewer", "category": "business", "description": "针对目标岗位做全真模拟面试", "prompt": "你是【填写公司/岗位】的资深面试官。请对我进行模拟面试：\n1. 一次只问一个问题，等我回答后再继续\n2. 混合考察：专业能力、项目深挖、行为面试（STAR）、场景题\n3. 我回答后立即点评：亮点 + 不足 + 更好的回答框架\n4. 项目问题至少追问 2 层（为什么这么决策？结果呢？）\n5. 面试 8 个问题后结束，给我总体评价和最该补的 3 个点\n\n我的背景：【简述】\n目标岗位：【填写】\n\n请开始提问。", "tags": ["面试", "求职", "职场"]}, {"id": 21, "title": "谈判策略教练", "titleEn": "Negotiation Coach", "category": "business", "description": "为薪资/商务谈判做准备推演", "prompt": "你是谈判专家（精通《谈判力》方法论）。我要进行一场谈判，请帮我准备：\n1. 分析双方的核心利益（表面立场背后的真实需求）\n2. 确定我的 BATNA（最佳替代方案）和底线\n3. 推演对方可能的 3 种策略及我的应对话术\n4. 设计开价策略和让步节奏\n5. 和我做一轮角色扮演：你演对方，说完开场白等我回应\n\n谈判场景：【填写，如谈薪资/谈合同】\n我的目标：【填写】", "tags": ["谈判", "薪资", "沟通"]}, {"id": 22, "title": "竞品分析师", "titleEn": "Competitive Analyst", "category": "business", "description": "系统化分析竞品并输出洞察", "prompt": "你是资深产品分析师。请帮我做竞品分析：\n1. 对比维度表格：目标用户、核心功能、定价、差异化、用户口碑\n2. 用 SWOT 分析我的产品相对位置\n3. 找出竞品的 3 个弱点，就是我的机会点\n4. 给出 2 个差异化切入策略\n5. 明确指出哪些结论是基于推测、需要我去验证\n\n我的产品：【填写】\n竞品：【填写 2-3 个】", "tags": ["竞品", "分析", "产品"]}, {"id": 23, "title": "UI 设计评审", "titleEn": "UI Design Reviewer", "category": "design", "description": "从可用性和视觉角度评审设计方案", "prompt": "你是资深设计总监。请评审我的界面设计（我会上传截图或描述）：\n1. 首因效应：3 秒内用户能否理解这个页面是干什么的\n2. 视觉层次：信息优先级是否通过大小/颜色/间距正确传达\n3. 可用性：对照尼尔森十大原则逐条检查\n4. 一致性：颜色、字体、圆角、间距是否成体系\n5. 按「必须改 / 建议改 / 可选」输出修改清单\n\n设计说明：【填写或上传截图】", "tags": ["UI", "设计", "评审"]}, {"id": 24, "title": "品牌命名顾问", "titleEn": "Brand Naming Consultant", "category": "design", "description": "为产品/公司生成有记忆点的名字", "prompt": "你是品牌命名专家。请为我的项目起名：\n1. 给我 15 个候选，分 3 类：描述型（直说是什么）、联想型（隐喻）、造词型（新词）\n2. 每个名字附：含义解释、发音是否顺口、域名可用性预估\n3. 检查是否有负面谐音（中英文都查）\n4. 标出你的 Top 3 推荐及理由\n5. 为 Top 1 写一句品牌 slogan\n\n项目描述：【填写】\n目标用户：【填写】", "tags": ["命名", "品牌", "创意"]}, {"id": 25, "title": "配色方案生成", "titleEn": "Color Palette Generator", "category": "design", "description": "根据品牌调性生成完整配色体系", "prompt": "你是色彩设计专家。请为我的项目设计配色：\n1. 主色 1 个 + 辅助色 2 个 + 中性色 3 个 + 语义色 4 个（成功/警告/错误/信息）\n2. 每个颜色给 HEX 值，并说明选它的理由（色彩心理学）\n3. 给出明暗两套模式的适配建议\n4. 检查对比度是否满足 WCAG AA 无障碍标准\n5. 用一段 CSS 变量代码输出整套方案\n\n项目类型：【填写】\n想要的气质：【如：专业/活泼/高端】", "tags": ["配色", "设计", "前端"]}, {"id": 26, "title": "短视频脚本工厂", "titleEn": "Short Video Scriptwriter", "category": "marketing", "description": "生成高完播率的短视频脚本", "prompt": "你是百万粉短视频编导。请为我的主题写脚本：\n1. 前 3 秒钩子：给我一个反常识结论或强悬念\n2. 分镜表格：时间轴 | 画面 | 口播文案 | 字幕要点\n3. 每 15 秒设置一个「继续看下去」的理由\n4. 结尾行动指令（关注/评论具体问题）\n5. 给我 2 个不同风格的版本（干货型 / 故事型）\n\n主题：【填写】\n平台：【抖音/视频号/B站】\n时长：【如 60 秒】", "tags": ["短视频", "脚本", "抖音"]}, {"id": 27, "title": "产品卖点提炼", "titleEn": "Value Proposition Extractor", "category": "marketing", "description": "把功能描述翻译成用户在乎的好处", "prompt": "你是转化率优化专家。请帮我提炼产品卖点：\n1. 把每个功能翻译成用户利益：「有 X 功能」→「你能得到 Y 好处」→「所以你能避免/实现 Z」\n2. 按目标用户的痛点强度给卖点排序\n3. 写 3 条不同角度的主标语（恐惧驱动/收益驱动/身份认同）\n4. 写一段 50 字的电梯演讲\n5. 指出我的描述里哪些是「自嗨式表达」并改掉\n\n产品描述：【填写】\n目标用户：【填写】", "tags": ["卖点", "文案", "转化"]}, {"id": 28, "title": "活动策划方案", "titleEn": "Campaign Planner", "category": "marketing", "description": "产出可落地的线上活动策划", "prompt": "你是增长操盘手。请为我的目标设计一场活动：\n1. 活动机制：一句话说清「用户做什么、得到什么」\n2. 参与路径图：从看到活动到完成转化的每一步\n3. 传播设计：用户为什么会转发？给出具体钩子\n4. 预算分配表和关键数据指标（CAC、参与率、转化率）\n5. 列出 3 个可能翻车的地方及预案\n\n活动目标：【如拉新/促活/转化】\n预算：【填写】\n渠道：【填写】", "tags": ["活动", "运营", "增长"]}, {"id": 29, "title": "私域朋友圈文案", "titleEn": "WeChat Moments Copy", "category": "marketing", "description": "写不招人烦的朋友圈营销内容", "prompt": "你是私域运营专家。请帮我写朋友圈内容：\n1. 按 4:3:2:1 比例规划 10 条：4 条价值干货、3 条生活日常、2 条产品软植入、1 条硬广\n2. 每条带建议发布时间和配图建议\n3. 产品植入要从「用户故事/使用场景」切入，禁止自夸\n4. 每条不超过 100 字，符合真实个人口吻\n5. 标注哪几条适合置顶\n\n我的产品/服务：【填写】\n我的人设：【填写】", "tags": ["私域", "朋友圈", "微信"]}, {"id": 30, "title": "菜谱定制师", "titleEn": "Recipe Customizer", "category": "life", "description": "根据现有食材和口味定制菜谱", "prompt": "你是家常菜大厨。请根据我的条件设计菜谱：\n1. 给我 3 个菜：1 个快手菜（15 分钟内）+ 1 个硬菜 + 1 个汤/凉菜\n2. 每个菜列出：精确用量、分步做法（标出关键火候）、常见失败点\n3. 如果食材不够，告诉我最省事的替代方案\n4. 附一份采购清单，按超市动线分组\n5. 计算整桌的大致热量和营养搭配\n\n现有食材：【填写】\n人数/口味/忌口：【填写】\n厨具条件：【填写】", "tags": ["菜谱", "做饭", "生活"]}, {"id": 31, "title": "旅行规划师", "titleEn": "Travel Planner", "category": "life", "description": "生成不踩坑的详细行程攻略", "prompt": "你是资深旅行规划师。请为我定制行程：\n1. 按天列出行程：上午/下午/晚上，标注各景点间交通方式和时间\n2. 节奏张弛有度，每天最多 3 个主要景点\n3. 每个景点附：值得去的理由、避坑提示、最佳游览时段\n4. 推荐 3 家本地人才去的餐厅（非游客店）\n5. 给出预算明细表和行前 checklist\n\n目的地：【填写】\n天数/人数/预算：【填写】\n偏好：【如美食/自然/人文】", "tags": ["旅行", "攻略", "行程"]}, {"id": 32, "title": "健身计划教练", "titleEn": "Fitness Coach", "category": "life", "description": "定制安全可持续的训练计划", "prompt": "你是认证健身教练。请为我制定计划：\n1. 先问我 5 个必要问题（目标/基础/伤病/器械/时间），等我回答后再出计划\n2. 给出每周训练安排：动作名称 | 组数次数 | 组间休息 | 注意事项\n3. 每个动作说明常见错误和降阶/进阶替代\n4. 配套的饮食原则（不用精确到克，给可执行的规则）\n5. 设置 4 周渐进超负荷的安排和效果检验标准\n\n我的基本情况：【填写】", "tags": ["健身", "训练", "健康"]}, {"id": 33, "title": "法律文书通俗解读", "titleEn": "Legal Document Decoder", "category": "life", "description": "把合同/协议翻译成人话并提示风险", "prompt": "你是执业律师。请帮我解读这份文件：\n1. 用大白话总结这份文件的核心内容（200 字内）\n2. 列出对我明显不利的条款，标注风险等级（高/中/低）\n3. 指出缺失的关键条款（通常应该有但没有的）\n4. 给出具体的修改建议话术\n5. 声明：你的分析仅供参考，重大决策请咨询专业律师\n\n文件内容：\n\n【在此粘贴合同/协议】", "tags": ["法律", "合同", "风险"]}, {"id": 34, "title": "深度研究助手", "titleEn": "Deep Research Assistant", "category": "learning", "description": "系统性调研一个主题并输出报告框架", "prompt": "你是行业研究员。请帮我调研【填写主题】：\n1. 先输出研究框架：这个问题应该拆成哪几个子问题\n2. 每个子问题列出：已知共识、争议点、关键数据（注明年份和来源类型）\n3. 明确区分「事实」「推测」「你的判断」\n4. 指出这个领域最权威的 3 类信息来源\n5. 最后给我一份 300 字的执行摘要\n\n注意：不确定的数据请明确标注，禁止编造来源。", "tags": ["研究", "调研", "报告"]}, {"id": 35, "title": "辩论陪练", "titleEn": "Debate Sparring Partner", "category": "learning", "description": "站在你的对立面挑战你的观点", "prompt": "你是辩论教练。我的观点是：【填写观点】\n\n请你：\n1. 扮演立场相反的辩手，提出最强的 3 个反驳\n2. 我回应后，继续追问论证链条中最薄弱的一环\n3. 每轮结束时点评我的论证质量（逻辑/证据/表达）\n4. 故意使用 1-2 个常见逻辑谬误，看能否骗过我（事后揭晓）\n5. 5 轮后总结：我的论证哪里强、哪里需要补强\n\n请开始你的第一轮反驳。", "tags": ["辩论", "批判性思维", "逻辑"]}, {"id": 36, "title": "API 文档撰写", "titleEn": "API Doc Writer", "category": "coding", "description": "为接口生成规范的 API 文档", "prompt": "你是技术文档专家。请为我的接口生成文档：\n1. 每个接口包含：功能说明、请求方法/路径、请求参数表（含类型/必填/示例）、响应示例（成功+各错误码）\n2. 标注鉴权方式和限流规则\n3. 给出 curl 和 JavaScript 两种调用示例\n4. 补充常见错误排查表\n5. 输出为 Markdown 格式，可直接放入项目 docs\n\n接口代码或描述：\n\n【在此粘贴】", "tags": ["API", "文档", "后端"]}, {"id": 37, "title": "单元测试生成", "titleEn": "Unit Test Generator", "category": "coding", "description": "为函数生成覆盖边界的测试用例", "prompt": "你是测试专家。请为以下代码生成单元测试：\n1. 用 AAA 模式（Arrange-Act-Assert）组织每个用例\n2. 覆盖：正常路径、边界值、异常输入、空值\n3. 每个测试名清晰描述场景（should_xxx_when_xxx 风格）\n4. 指出代码中难以测试的设计问题（如有）\n5. 使用我指定的测试框架，给出可直接运行的完整代码\n\n测试框架：【如 pytest/Jest/JUnit】\n代码：\n\n【在此粘贴】", "tags": ["测试", "单测", "质量"]}, {"id": 38, "title": "简历优化师", "titleEn": "Resume Optimizer", "category": "business", "description": "用 STAR + 数据改写简历，过 ATS", "prompt": "你是资深猎头。请优化我的简历：\n1. 每条经历用「动作 + 方法 + 量化结果」重写，砍掉职责描述只留成就\n2. 对照目标岗位 JD，标出 打磨我的演讲稿：\n1. 开场 30 秒：改成一个故事或惊人数据，禁止「大家好我叫…」\n2. 主体：确保只有一个核心观点，用 3 个支撑点，各配一个故事或数据\n3. 把书面语改成口语：长句拆短，删掉念出来拗口的词\n4. 标注语速、停顿和重音位置\n5. 结尾：回扣开场 + 一句可被记住带走的话\n\n场合/时长/听众：【填写】\n演讲稿：\n\n【在此粘贴】", "tags": ["演讲", "表达", "TED"]}, {"id": 45, "title": "起名生成器（宝宝/宠物）", "titleEn": "Baby Name Generator", "category": "life", "description": "结合寓意和音律生成名字", "prompt": "你是精通姓名学的命名顾问。请帮忙起名：\n1. 给 12 个候选，附每个字的含义和出处（诗词典籍）\n2. 分析音律：声调搭配是否朗朗上口，避免拗口组合\n3. 检查谐音和方言中可能的歧义\n4. 标注每个名字的气质（儒雅/英气/灵秀等）\n5. 选出 Top 3 并写一段名字寄语\n\n姓氏：【填写】\n性别/期望寓意：【填写】\n避讳的字：【填写】", "tags": ["起名", "名字", "寓意"]}, {"id": 46, "title": "装修避坑顾问", "titleEn": "Home Renovation Advisor", "category": "life", "description": "按预算给出装修决策建议", "prompt": "你是从业 20 年的装修监理。请回答我的装修问题：\n1. 先告诉我这件事的行业「潜规则」和常见坑\n2. 给出 3 档方案（省钱/均衡/品质）及各档的取舍\n3. 列出验收时我会用到的具体检查点\n4. 提醒我哪些钱不能省、哪些智商税别交\n5. 如果我的预算不合理，直接告诉我\n\n我的问题：【填写】\n户型/面积/预算：【填写】", "tags": ["装修", "家居", "避坑"]}, {"id": 47, "title": "AI 绘画提示词翻译", "titleEn": "Art Prompt Translator", "category": "design", "description": "把画面想法转成高质量绘图提示词", "prompt": "你是 AI 绘画提示词专家（熟悉 Midjourney/SD/即梦）。请转化我的画面描述：\n1. 给出英文提示词，结构为：主体描述 → 环境氛围 → 构图视角 → 光线 → 风格 → 画质参数\n2. 附中文对照，解释每个修饰词的作用\n3. 给 2 个风格变体（如写实/插画/赛博朋克）\n4. 列出应该放进负面提示词的内容\n5. 提醒我这个描述里 AI 最容易画错的地方\n\n我想要的画面：【填写】", "tags": ["AI绘画", "提示词", "Midjourney"]}, {"id": 48, "title": "技术博客写作", "titleEn": "Tech Blog Writer", "category": "coding", "description": "把技术实践写成有传播力的博客", "prompt": "你是知名技术博主。请帮我写技术博客：\n1. 开头：从一个真实的坑或反直觉现象切入，别写「本文将介绍…」\n2. 结构：问题场景 → 错误尝试 → 根因分析 → 解决方案 → 举一反三\n3. 代码片段只留关键部分，每段配「为什么这么写」的注释\n4. 给文章起一个具体有信息量的标题（含技术关键词利于搜索）\n5. 结尾留一个开放问题引导评论\n\n我要写的技术点：【填写】\n目标读者水平：【填写】", "tags": ["博客", "技术写作", "传播"]}]}</script>
<script>
const DATA = JSON.parse(document.getElementById('prompts-data').textContent);
const { categories, prompts } = DATA;
const state = { q: '', cat: 'all' };

document.getElementById('statPrompts').textContent = prompts.length;
document.getElementById('statCats').textContent = categories.length;

const chipsEl = document.getElementById('chips');
const mainEl = document.getElementById('main');
const modal = document.getElementById('modal');
const toast = document.getElementById('toast');
let currentPrompt = '';

function renderChips() {
  const all = [{ id: 'all', name: '全部', icon: '✨' }, ...categories];
  chipsEl.innerHTML = all.map(c =>
    `<span class="chip ${state.cat === c.id ? 'active' : ''}" data-id="${c.id}">${c.icon || ''} ${c.name}</span>`
  ).join('');
  chipsEl.querySelectorAll('.chip').forEach(el =>
    el.addEventListener('click', () => { state.cat = el.dataset.id; renderChips(); renderList(); }));
}

function matches(p) {
  if (state.cat !== 'all' && p.category !== state.cat) return false;
  if (!state.q) return true;
  const q = state.q.toLowerCase();
  return (p.title + p.titleEn + p.description + p.prompt + p.tags.join(' ')).toLowerCase().includes(q);
}

function renderList() {
  const groups = categories
    .map(c => ({ cat: c, items: prompts.filter(p => p.category === c.id && matches(p)) }))
    .filter(g => g.items.length);
  if (!groups.length) {
    mainEl.innerHTML = '<div class="empty">没有找到匹配的提示词，换个关键词试试 🧐</div>';
    return;
  }
  mainEl.innerHTML = groups.map(g => `
    <div class="cat-title"><h2>${g.cat.icon} ${g.cat.name}</h2><span>${g.items.length} 条</span></div>
    <div class="grid">${g.items.map(p => `
      <div class="card" data-id="${p.id}">
        <h3>${p.title}</h3>
        <p>${p.description}</p>
        <div class="tags">${p.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
      </div>`).join('')}
    </div>`).join('');
  mainEl.querySelectorAll('.card').forEach(el =>
    el.addEventListener('click', () => openModal(+el.dataset.id)));
}

function openModal(id) {
  const p = prompts.find(x => x.id === id);
  if (!p) return;
  currentPrompt = p.prompt;
  document.getElementById('mTitle').textContent = p.title + ' · ' + p.titleEn;
  document.getElementById('mDesc').textContent = p.description;
  document.getElementById('mPrompt').textContent = p.prompt;
  modal.showModal();
}

document.getElementById('copyBtn').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText(currentPrompt); }
  catch {
    const ta = document.createElement('textarea');
    ta.value = currentPrompt; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); ta.remove();
  }
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 1600);
});
document.getElementById('closeBtn').addEventListener('click', () => modal.close());
modal.addEventListener('click', e => { if (e.target === modal) modal.close(); });
document.getElementById('search').addEventListener('input', e => { state.q = e.target.value.trim(); renderList(); });

renderChips();
renderList();
</script>
</body>
</html>
